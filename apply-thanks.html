<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>הבקשה נקלטה · מתן משיח</title>
<meta name="description" content="הבקשה לפגישת מסחר נקלטה. נחזור אליך בוואטסאפ.">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  *{ margin:0; padding:0; box-sizing:border-box; }
  :root{ --bg:#060608; --text:#F5F5F5; --dim:#8A8A9A; --gold:#D4AF37; --line:rgba(255,255,255,.08); }
  body{ background:var(--bg); color:var(--text); font-family:'Heebo',system-ui,sans-serif;
        min-height:100vh; display:grid; place-items:center; padding:24px; line-height:1.7; }
  .card{ max-width:520px; text-align:center; border:1px solid var(--line); border-radius:16px;
         padding:40px 28px; background:rgba(255,255,255,.03); }
  .mark{ width:56px; height:56px; margin:0 auto 20px; border-radius:50%; display:grid; place-items:center;
         border:1px solid rgba(212,175,55,.45); color:var(--gold); font-size:26px; }
  .eyebrow{ color:var(--gold); font-size:13px; font-weight:700; letter-spacing:.06em; margin-bottom:10px; }
  h1{ font-size:28px; font-weight:800; margin-bottom:14px; }
  p{ color:var(--dim); font-size:16px; margin-bottom:14px; }
  .next{ border-top:1px solid var(--line); margin-top:22px; padding-top:22px; }
  a.btn{ display:inline-block; margin-top:6px; padding:13px 26px; border-radius:10px; text-decoration:none;
         font-weight:700; color:#0d0d0d; background:var(--gold); }
  a.quiet{ display:block; margin-top:16px; color:var(--dim); font-size:14px; }
</style>
</head>
<body>
<main class="card">
  <div class="mark">&#10003;</div>
  <p class="eyebrow">הבקשה נקלטה</p>
  <h1>קיבלתי את הפרטים שלך.</h1>
  <p>אני עובר על הבקשות בעצמי, ואם יש התאמה נחזור אליך בוואטסאפ לתיאום הפגישה.</p>
  <div class="next">
    <p>בינתיים, אם עוד לא ראית את פרוטוקול היום האדום, זה המקום להתחיל.</p>
    <a class="btn" href="madrich.html">למדריך היום האדום &#8592;</a>
    <a class="quiet" href="index.html">חזרה לאתר</a>
  </div>
</main>
</body>
</html>
