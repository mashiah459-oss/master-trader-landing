<style>
  :root{
    --bg:#05090f; --bg2:#0a1422;
    --azure:#4fc3ff; --azure-bright:#84d6ff; --azure-deep:#1f80c4;
    --ink:#eef5fc; --muted:#90a6c2; --line:rgba(79,195,255,.22);
    --glass:rgba(120,200,255,.055);
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;width:100%;max-width:100%;overflow-x:hidden}
  body{
    font-family:-apple-system,"SF Hebrew","Heebo","Assistant","Arial",sans-serif;
    background:var(--bg);color:var(--ink);overflow-y:hidden;
    position:fixed;inset:0;-webkit-font-smoothing:antialiased;
  }
  /* progress */
  #bar{position:fixed;top:0;left:0;right:0;height:3px;background:rgba(120,170,220,.10);z-index:30}
  #bar>i{display:block;height:100%;width:0;border-radius:0 3px 3px 0;
    background:linear-gradient(90deg,var(--azure-deep),var(--azure-bright));
    box-shadow:0 0 14px rgba(79,195,255,.6);transition:width .5s cubic-bezier(.4,0,.2,1)}
  /* card stage */
  #stage{position:absolute;inset:0;z-index:1}
  .card{
    position:absolute;top:0;bottom:0;left:0;right:0;width:100%;display:flex;flex-direction:column;
    align-items:center;justify-content:center;padding:46px 24px 48px;
    opacity:0;transform:translateY(26px) scale(.99);pointer-events:none;
    transition:opacity .55s ease,transform .55s cubic-bezier(.2,.7,.2,1);
  }
  .card.active{opacity:1;transform:none;pointer-events:auto}
  /* proof background — a WALL of profit/loss screenshots fills the screen, faint */
  .bg{position:absolute;inset:0;background-size:cover;background-position:center;z-index:-2;opacity:.34}
  .bg-scrim{position:absolute;inset:0;z-index:-1;
    background:linear-gradient(180deg,rgba(5,9,15,.42) 0%,rgba(5,9,15,.60) 50%,rgba(5,9,15,.72) 100%)}
  .gradient{position:absolute;inset:0;z-index:-2;
    background:
      radial-gradient(75% 55% at 50% -8%,rgba(79,195,255,.16),transparent 60%),
      radial-gradient(120% 90% at 50% 12%,#0c1c30 0%,#05090f 62%)}
  .inner{width:100%;max-width:440px;margin-inline:auto;text-align:center;z-index:2}
  .kicker{color:var(--azure);font-size:13px;letter-spacing:4px;margin-bottom:22px;font-weight:700;
    text-transform:uppercase}
  h1{font-size:31px;line-height:1.3;font-weight:800;margin-bottom:10px;letter-spacing:-.5px}
  h2{font-size:27px;line-height:1.42;font-weight:700;margin-bottom:30px;letter-spacing:-.4px;
    text-shadow:0 2px 18px rgba(0,0,0,.55)}
  .sub{color:var(--muted);font-size:16px;margin-bottom:30px;line-height:1.65;
    text-shadow:0 2px 14px rgba(0,0,0,.5)}
  .consent{display:flex;gap:10px;align-items:flex-start;text-align:right;margin:4px 2px 2px;
    font-size:13.5px;color:var(--muted);line-height:1.5;cursor:pointer}
  .consent input{accent-color:var(--azure);width:18px;height:18px;margin-top:1px;flex:0 0 auto}
  .answers{display:flex;flex-direction:column;gap:13px;width:100%}
  .opt{
    background:var(--glass);border:1.5px solid var(--line);color:var(--ink);
    padding:19px 22px;border-radius:16px;font-size:17.5px;font-weight:600;cursor:pointer;
    text-align:right;transition:.2s cubic-bezier(.3,.7,.3,1);backdrop-filter:blur(8px);
    animation:rise .5s both;
  }
  .opt:nth-child(1){animation-delay:.05s}.opt:nth-child(2){animation-delay:.11s}
  .opt:nth-child(3){animation-delay:.17s}.opt:nth-child(4){animation-delay:.23s}
  .opt:hover,.opt:active{background:rgba(79,195,255,.13);border-color:var(--azure);
    box-shadow:0 12px 34px -12px rgba(79,195,255,.6);transform:translateY(-2px)}
  @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  .field{width:100%;padding:19px;border-radius:16px;border:1.5px solid var(--line);
    background:var(--glass);color:var(--ink);font-size:18px;margin-bottom:13px;text-align:right;
    backdrop-filter:blur(8px);transition:.2s}
  .field::placeholder{color:#6f86a3}
  .field:focus{outline:none;border-color:var(--azure);box-shadow:0 0 0 4px rgba(79,195,255,.14)}
  .btn{display:inline-block;background:linear-gradient(180deg,var(--azure-bright),var(--azure-deep));
    color:#04121f;font-weight:800;font-size:19px;padding:19px 30px;border-radius:40px;
    border:none;cursor:pointer;width:100%;margin-top:8px;letter-spacing:-.2px;
    box-shadow:0 12px 32px -8px rgba(79,195,255,.55);transition:.2s}
  .btn:hover{transform:translateY(-2px);box-shadow:0 16px 40px -8px rgba(79,195,255,.7)}
  .btn:active{transform:translateY(0)}
  .leak-badge{display:inline-block;background:rgba(79,195,255,.12);border:1px solid var(--line);
    color:var(--azure-bright);font-weight:700;font-size:14px;letter-spacing:1px;
    padding:7px 16px;border-radius:30px;margin-bottom:18px}
  .action-box{background:var(--glass);border:1px solid var(--line);border-radius:14px;
    padding:16px 18px;margin:6px 0 22px;text-align:right;font-size:15.5px;line-height:1.6}
  .action-box b{color:var(--azure-bright)}
  .ph{color:var(--muted);font-size:14px;padding:20px;text-align:center}
  .step-n{position:fixed;top:18px;right:20px;color:var(--azure);font-size:13px;font-weight:700;
    letter-spacing:2px;z-index:30;opacity:.85}
  #back{position:fixed;top:13px;left:16px;z-index:31;display:none;cursor:pointer;
    background:rgba(120,200,255,.08);border:1px solid var(--line);color:var(--azure);
    font:600 13px -apple-system,"Heebo",Arial;padding:8px 15px;border-radius:30px;
    backdrop-filter:blur(6px);transition:.2s}
  #back:hover{background:rgba(79,195,255,.16)}
  .small{font-size:13px;color:var(--muted);margin-top:16px;line-height:1.6}
  a{color:var(--azure)}
</style>
</head>
<body>
<div id="bar"><i></i></div>
<div class="step-n"></div>
<button id="back" type="button">חזרה ←</button>
<div id="stage"></div>

<script>
// ====== attribution: capture source on load, carry to lead + Whop ======
const Q = new URLSearchParams(location.search);
const fromAd = Q.has('fbclid') || Q.get('utm_source')==='meta';
const SOURCE = {
  utm_source: fromAd ? 'meta' : (Q.get('utm_source')||'organic'),
  utm_content: Q.get('utm_content') || Q.get('ad') || '',
  cre: (Q.get('cre')||'').toLowerCase(),   // creative concept -> matched intro
  fbclid: Q.get('fbclid') || ''
};
// per-creative opening (message match): every ad bridges to the same enemy — "the chase for another strategy"
const INTROS = {
  puppet: { kicker:'רגע אמת', h1:'מי באמת שולט בעסקאות שלך?',
            sub:'אם זה הרגש ולא אתה — יש לזה שם.<br>6 שאלות, ותבין בדיוק מה עוצר אותך.' },
  wheel:  { kicker:'רגע אמת', h1:'תקוע באותו לופ?',
            sub:'קונה שיטה, שורף אותה, מבטיח שהפעם לפי החוקים — ושוב.<br>בוא נבין למה, באמת.' },
  _default: { kicker:'רגע אמת', h1:'למה הרווח לא נשאר אצלך?',
            sub:'לצדוק בכיוון זה לא אותו דבר כמו להרוויח.<br>6 שאלות, ותבין בדיוק מה עוצר אותך.' },
};
const WHOP = "https://whop.com/master-trader-club/";
function whopUrl(){
  const p=new URLSearchParams();
  p.set('utm_source',SOURCE.utm_source); p.set('utm_medium',fromAd?'paid':'web');
  p.set('utm_campaign','club'); if(SOURCE.utm_content)p.set('utm_content',SOURCE.utm_content);
  if(SOURCE.fbclid)p.set('fbclid',SOURCE.fbclid);
  return WHOP+'?'+p.toString();
}

// ====== lead destination (FormSubmit -> email; no PII in repo) ======
const LEAD_ENDPOINT = "https://formsubmit.co/ajax/mashiah459@gmail.com";
const YT = "https://www.youtube.com/@matanmashiah";
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

// ====== the diagnostic: 4 leak archetypes, scored across the questions ======
// arch keys: chase (המרדף) · emotion (הרגשן) · nostruct (חסר-המבנה) · gambler (המהמר) · '' = healthy
const QUESTIONS = [
  { id:'trader', kicker:'נתחיל', q:'קודם כל — אתה כבר סוחר בפועל?',
    opts:[
      {l:'כן, אני סוחר פעיל', arch:''},
      {l:'התחלתי לא מזמן', arch:''},
      {l:'עדיין לא, רק לומד', arch:'', beginner:true},
    ]},
  { id:'lookback', kicker:'שאלה 1', q:'בשנה האחרונה — מה הכי נכון לגביך?',
    opts:[
      {l:'החלפתי כמה שיטות. עדיין מחפש את זו שתעבוד', arch:'chase'},
      {l:'יש לי שיטה. פשוט לא תמיד דבק בה', arch:'nostruct'},
      {l:'אני נכנס הרבה מהתחושה של הרגע', arch:'emotion'},
      {l:'אני מגדיל כשאני מרגיש שאני צודק', arch:'gambler'},
    ]},
  { id:'afterloss', kicker:'שאלה 2', q:'אחרי הפסד — מה קורה לך, באמת?',
    opts:[
      {l:'מחפש סטאפ או שיטה אחרת', arch:'chase'},
      {l:'נכנס לעסקת נקמה כדי להחזיר', arch:'emotion'},
      {l:'מגדיל את העסקה הבאה כדי להחזיר מהר', arch:'gambler'},
      {l:'ממשיך לפי התוכנית. בלי לשנות כלום', arch:''},
    ]},
  { id:'structure', kicker:'שאלה 3', q:'יש לך תוכנית כתובה ויומן שאתה ממלא?',
    opts:[
      {l:'לא. אני סוחר לפי זיכרון ותחושה', arch:'nostruct'},
      {l:'יש תוכנית. יומן — לא ממש', arch:'nostruct'},
      {l:'יש לי הכל. פשוט לא דבק בזה', arch:'emotion'},
      {l:'כן, הכל מסודר אצלי', arch:''},
    ]},
  { id:'unplanned', kicker:'שאלה 4', q:'מה הכי מכניס אותך לעסקה שלא תכננת?',
    opts:[
      {l:'פחד לפספס את התנועה', arch:'emotion'},
      {l:'שיטה חדשה שראיתי, והתלהבתי', arch:'chase'},
      {l:'שעמום. סתם בא לי פעולה', arch:'gambler'},
      {l:'כמעט לא קורה לי', arch:''},
    ]},
  { id:'size', kicker:'שאלה 5', q:'גודל העסקה שלך נקבע לפי—',
    opts:[
      {l:'אחוז סיכון קבוע. תמיד', arch:''},
      {l:'כמה שאני בטוח בעסקה', arch:'gambler'},
      {l:'גדל אחרי הפסד, כדי להחזיר', arch:'gambler'},
      {l:'האמת? לא באמת מחשב סיכון', arch:'nostruct'},
    ]},
];

// personalized result per archetype (spoken, short-line, in Matan's voice)
const RESULTS = {
  chase: { title:'אתה רודף אחרי השיטה הבאה.',
    body:'כל שיטה חדשה מרגישה כמו הישועה.<br>אבל אף אחת לא מקבלת מספיק זמן כדי לעבוד.<br>הבעיה שלך היא לא ידע.<br>היא שאתה לא נשאר עם כלום.<br>וזה בדיוק מה שמוציא לך את הרווח מהיד.',
    action:'השבוע: בחר <b>שיטה אחת</b> שאתה כבר מכיר.<br>תן לה 20 עסקאות מלאות לפני שאתה שופט. בלי לקפוץ.' },
  emotion: { title:'הרגש מנהל לך את היד.',
    body:'FOMO. נקמה בשוק. טילט אחרי רצף הפסדים.<br>אתה יודע בדיוק מה נכון לעשות.<br>ברגע האמת מישהו אחר לוחץ על הכפתור.<br>זו לא בעיה של אסטרטגיה.<br>זו שליטה עצמית.',
    action:'כלל אחד להשבוע:<br>לפני כל כניסה, כתוב במשפט אחד למה.<br><b>אין משפט? אין עסקה.</b>' },
  nostruct: { title:'אתה סוחר בלי מבנה שמחזיק אותך.',
    body:'בלי תוכנית כתובה. בלי יומן.<br>כל בוקר מתחיל מאפס,<br>ואתה סומך על הזיכרון והתחושה.<br>בלי מבנה אין איך להשתפר —<br>כי אין לך מה לבדוק.',
    action:'תתחיל <b>יומן מסחר היום</b>.<br>גם שורה אחת לעסקה:<br>מה ראית, למה נכנסת, מה יצא.' },
  gambler: { title:'אתה מתייחס למסחר כמו קזינו.',
    body:'עסקאות שגדלות מהתחושה.<br>סיכון שמשתנה לפי כמה אתה בטוח.<br>הכפלה אחרי הפסד.<br>זה מרגיש כמו ביטחון.<br>זה מה שמוחק חשבונות.<br>מסחר זה עסק, לא רולטה.',
    action:'קבע <b>סיכון קבוע לעסקה</b> — למשל 1% מהתיק.<br>ואל תחרוג. לא משנה כמה "בטוח" זה מרגיש.' },
};

const answers = {};    // id -> chosen label (for the lead email)
const picks = {};      // id -> archetype key (scoring is recomputed from this, never mutated incrementally)
let idx = 0;           // current question index
let track = 'club';    // becomes archetype or 'youtube' -> stored with the lead
let leadOpen = false;
let done = false;
let beginner = false;
const STEP_TARGET = QUESTIONS.length + 1;
const stage = document.getElementById('stage');
const barI = document.querySelector('#bar > i');
const stepN = document.querySelector('.step-n');
const backBtn = document.getElementById('back');

function setProgress(n,label){ barI.style.width = Math.min(100,100*n/STEP_TARGET)+'%'; stepN.textContent = label||''; }
function updateBack(){ backBtn.style.display = (!done && (leadOpen || idx>0)) ? 'block' : 'none'; }

function topArchetype(){
  // recompute fresh from picks every time — no incremental state to get out of sync
  const sc={chase:0,emotion:0,nostruct:0,gambler:0};
  for(const id in picks){ const a=picks[id]; if(a && sc[a]!=null) sc[a]++; }
  // tie-break priority: the hero enemy (chase) first, then emotion, nostruct, gambler
  const order=['chase','emotion','nostruct','gambler'];
  let best=order[0];
  for(const k of order){ if(sc[k] > sc[best]) best=k; }
  return sc[best]>0 ? best : 'nostruct';  // default if all-healthy: structure is the safe first fix
}

function card(html, bg){
  const c=document.createElement('div'); c.className='card';
  const base = bg ? `<div class="bg"></div><div class="bg-scrim"></div>` : `<div class="gradient"></div>`;
  c.innerHTML = base + html;
  if(bg) c.querySelector('.bg').style.backgroundImage = `url("${bg}")`;
  stage.appendChild(c);
  requestAnimationFrame(()=>{ document.querySelectorAll('.card.active').forEach(e=>e.classList.remove('active'));
    requestAnimationFrame(()=>c.classList.add('active')); });
  setTimeout(()=>{ [...stage.children].slice(0,-2).forEach(e=>e.remove()); },600);
  return c;
}

function renderIntro(){
  done=false; leadOpen=false; idx=0; beginner=false;
  for(const k in picks) delete picks[k];
  setProgress(0,''); updateBack();
  const it = INTROS[SOURCE.cre] || INTROS._default;
  const c = card(`<div class="inner">
      <div class="kicker">${it.kicker}</div>
      <h1>${it.h1}</h1>
      <div class="sub">${it.sub}</div>
      <button class="btn" id="start">בוא נראה ←</button>
      <div class="small">פחות מדקה. בלי התחייבות.</div>
    </div>`);
  c.querySelector('#start').addEventListener('click',()=>renderQuestion(0));
}

function renderQuestion(i){
  idx=i;
  const s=QUESTIONS[i];
  setProgress(i, String(i+1)+'/'+QUESTIONS.length); updateBack();
  const c = card(`<div class="inner">
      <div class="kicker">${s.kicker}</div>
      <h2>${s.q}</h2>${s.sub?`<div class="sub">${s.sub}</div>`:''}
      <div class="answers"></div>
    </div>`, s.bg);
  const wrap = c.querySelector('.answers');
  s.opts.forEach(o=>{
    const b=document.createElement('button'); b.className='opt'; b.textContent=o.l;  // XSS-safe
    b.addEventListener('click',()=>{
      answers[s.id]=o.l; picks[s.id]=o.arch;
      if(o.beginner){ beginner=true; track='youtube'; openLead(); return; }
      beginner=false;
      if(i+1 < QUESTIONS.length) renderQuestion(i+1);
      else { track = topArchetype(); openLead(); }
    });
    wrap.appendChild(b);
  });
}

function openLead(){ leadOpen=true; renderLeadGate(); }

function back(){
  if(done) return;
  // scoring is recomputed from picks at the end, so navigating back needs no score bookkeeping;
  // re-answering simply overwrites picks[id].
  if(leadOpen){ leadOpen=false; renderQuestion(idx); return; }
  if(idx<=0){ renderIntro(); return; }
  renderQuestion(idx-1);
}
backBtn.addEventListener('click', back);

function renderLeadGate(){
  setProgress(STEP_TARGET-0.5,''); updateBack();
  const c = card(`<div class="inner">
      <div class="kicker">רגע אחרון</div>
      <h2>סיימת. יש לי בשבילך תשובה.</h2>
      <div class="sub">לאן לשלוח לך אותה — עם הצעד הראשון לתקן?</div>
      <input class="field" id="lead-name" placeholder="השם שלך" autocomplete="given-name">
      <input class="field" id="lead-phone" placeholder="טלפון (וואטסאפ)" inputmode="tel" autocomplete="tel">
      <input class="field" id="lead-email" placeholder="אימייל (לקבלת האבחון והתוכן)" inputmode="email" autocomplete="email">
      <label class="consent"><input type="checkbox" id="lead-consent" checked>
        <span>אישור קבלת תוכן שמקדם אותך ואת המסחר שלך (אפשר לבטל בכל עת)</span></label>
      <button class="btn" id="lead-go">לקבל את התשובה ←</button>
      <div class="small">הפרטים נשמרים אצלנו במערכת בלבד. לא ספאם.</div>
    </div>`);
  c.querySelector('#lead-go').addEventListener('click',submitLead);
}

function submitLead(){
  const name=(document.getElementById('lead-name').value||'').trim();
  const phone=(document.getElementById('lead-phone').value||'').trim();
  const email=(document.getElementById('lead-email').value||'').trim();
  const consent=document.getElementById('lead-consent').checked;
  if(name.length<2 || phone.replace(/\D/g,'').length<9){ alert('מלא שם וטלפון תקין'); return; }
  if(email && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){ alert('כתובת אימייל לא תקינה'); return; }
  const eid='L_'+Date.now()+'_'+Math.floor(Math.random()*1e6);
  if(window.fbq) fbq('track','Lead',{},{eventID:eid});
  const clean=s=>String(s||'').replace(/[~|\r\n\t]/g,' ').trim();
  const leadLine='@@Q@@'+[clean(email)||'-',clean(name),clean(phone),consent?'1':'0',track,
                          clean(SOURCE.utm_content)||'-',clean(SOURCE.fbclid)||'-',eid].join('~')+'@@/Q@@';
  const payload={ _subject:'ליד חדש משאלון המועדון', name, phone, email,
                  'אישור דיוור':consent?'כן':'לא', 'דליפה':track, ...answers,
                  מקור:SOURCE.utm_source, מודעה:SOURCE.utm_content, lead_line:leadLine, _template:'table' };
  fetch(LEAD_ENDPOINT,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)})
    .catch(()=>{});
  renderVerdict(name);
}

function renderVerdict(name){
  done=true; setProgress(STEP_TARGET,''); updateBack();
  const nm=esc(name);
  if(beginner){
    card(`<div class="inner">
      <div class="kicker">האבחון שלך</div>
      <h2>${nm}, אתה בשלב הבסיס — וזה בסדר גמור.</h2>
      <div class="sub">לפני שמשקיעים בליווי, בונים יסודות נכון. תתחיל מהערוץ ביוטיוב, לפי הסדר:</div>
      <div class="answers">
        <a class="opt" style="display:block;text-decoration:none" target="_blank" rel="noopener"
           href="https://www.youtube.com/playlist?list=PLxf3Ml18PULClOY53kjEdEIVy0HJ3SzSr">1. הקורס החינמי — היסודות ←</a>
        <a class="opt" style="display:block;text-decoration:none" target="_blank" rel="noopener"
           href="https://www.youtube.com/playlist?list=PLxf3Ml18PULDt2SCFPqAL5qhcsy-f5r2t">2. מנטורשיפ 2026 ←</a>
      </div>
      <a class="btn" href="${YT}" target="_blank" rel="noopener">לכל הערוץ ←</a>
      <div class="small">כשתתחיל לסחור בקביעות — תחזור. נשמח ללוות אותך משם.</div>
    </div>`);
    return;
  }
  const r = RESULTS[track] || RESULTS.nostruct;
  card(`<div class="inner">
      <div class="kicker">האבחון שלך</div>
      <h2>${nm}, ${r.title}</h2>
      <div class="sub">${r.body}</div>
      <div class="action-box">🎯 <b>הצעד הראשון שלך:</b><br>${r.action}</div>
      <div class="sub" style="margin-bottom:18px">וזו בדיוק העבודה שאנחנו עושים במועדון.<br>לא עוד אסטרטגיה —<br>להפוך אותך לאדם שמבצע.<br>כל בוקר, לייב, ביחד.</div>
      <a class="btn" href="${whopUrl()}" target="_blank" rel="noopener">בוא תראה איך זה עובד ←</a>
      <div class="small">בלי התחייבות. קודם תיישם את הצעד הראשון — הוא שלך, במתנה.</div>
    </div>`);
}

renderIntro();
</script>
