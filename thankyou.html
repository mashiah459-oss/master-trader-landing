    <style>
        @import url('https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800;900&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');

        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg: #060608;
            --bg-card: rgba(255, 255, 255, 0.03);
            --gold: #D4AF37;
            --gold-light: #F0D060;
            --gold-dark: #A8872B;
            --gold-glow: rgba(212, 175, 55, 0.35);
            --gold-subtle: rgba(212, 175, 55, 0.08);
            --text: #F5F5F5;
            --text-dim: #8A8A9A;
            --text-muted: #555566;
            --glass-border: rgba(255, 255, 255, 0.07);
            --glass-border-hover: rgba(212, 175, 55, 0.25);
        }

        body {
            font-family: 'Heebo', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            display: flex;
            flex-direction: column;
        }

        /* === AMBIENT BACKGROUND === */
        .bg-ambient { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
        .bg-orb { position: absolute; border-radius: 50%; filter: blur(80px); }
        .bg-orb-1 {
            width: 500px; height: 500px;
            background: radial-gradient(circle, rgba(212, 175, 55, 0.14) 0%, transparent 70%);
            top: -10%; left: -15%;
            animation: orbFloat1 25s ease-in-out infinite;
        }
        .bg-orb-2 {
            width: 400px; height: 400px;
            background: radial-gradient(circle, rgba(212, 175, 55, 0.07) 0%, transparent 70%);
            bottom: 5%; right: -20%;
            animation: orbFloat2 30s ease-in-out infinite;
        }
        @keyframes orbFloat1 { 0%,100% { transform: translate(0,0);} 50% { transform: translate(40px,30px);} }
        @keyframes orbFloat2 { 0%,100% { transform: translate(0,0);} 50% { transform: translate(-30px,-40px);} }
        .bg-ambient::after {
            content: '';
            position: absolute;
            inset: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E");
            opacity: 0.4;
        }

        /* === LAYOUT === */
        .wrap {
            position: relative;
            z-index: 1;
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 48px 20px;
        }

        .thanks-card {
            background: var(--bg-card);
            backdrop-filter: blur(14px);
            border: 1px solid var(--glass-border-hover);
            border-radius: 26px;
            padding: 44px 32px;
            max-width: 540px;
            width: 100%;
            text-align: center;
            box-shadow: 0 16px 64px rgba(0,0,0,0.4);
        }

        /* === SUCCESS CHECK === */
        .check-ring {
            width: 84px;
            height: 84px;
            border-radius: 50%;
            background: var(--gold-subtle);
            border: 1px solid var(--glass-border-hover);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px;
            position: relative;
            animation: pop 0.6s cubic-bezier(0.16, 1, 0.3, 1) both;
        }
        .check-ring::after {
            content: '';
            position: absolute;
            inset: -8px;
            border-radius: 50%;
            border: 1px solid rgba(212,175,55,0.18);
            animation: pulse 2.4s ease-out infinite;
        }
        .check-mark {
            color: var(--gold);
            font-size: 42px;
            font-weight: 800;
            line-height: 1;
        }
        @keyframes pop { from { opacity: 0; transform: scale(0.6); } to { opacity: 1; transform: scale(1); } }
        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.7; }
            100% { transform: scale(1.35); opacity: 0; }
        }

        .eyebrow {
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--gold-dark);
            margin-bottom: 14px;
        }

        h1 {
            font-size: clamp(28px, 6vw, 40px);
            font-weight: 800;
            line-height: 1.25;
            margin-bottom: 14px;
            background: linear-gradient(135deg, var(--text) 30%, var(--gold) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .lead {
            font-size: 17px;
            color: var(--text-dim);
            line-height: 1.7;
            margin-bottom: 28px;
        }
        .lead strong { color: var(--text); font-weight: 600; }

        /* === WHATSAPP NOTE === */
        .wa-note {
            display: flex;
            align-items: flex-start;
            gap: 14px;
            text-align: right;
            background: rgba(37, 211, 102, 0.06);
            border: 1px solid rgba(37, 211, 102, 0.25);
            border-radius: 16px;
            padding: 18px 20px;
            margin-bottom: 28px;
        }
        .wa-icon {
            flex-shrink: 0;
            width: 40px;
            height: 40px;
            border-radius: 11px;
            background: rgba(37, 211, 102, 0.12);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .wa-note p {
            font-size: 14px;
            color: var(--text-dim);
            line-height: 1.65;
        }
        .wa-note p strong { color: #25D366; font-weight: 700; }

        /* === DETAILS RECAP === */
        .recap {
            display: grid;
            gap: 2px;
            text-align: right;
            margin-bottom: 28px;
        }
        .recap-row {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 13px 0;
            border-bottom: 1px solid rgba(255,255,255,0.04);
        }
        .recap-row:last-child { border-bottom: none; }
        .recap-icon {
            width: 38px; height: 38px;
            border-radius: 11px;
            background: var(--gold-subtle);
            display: flex; align-items: center; justify-content: center;
            font-size: 17px; flex-shrink: 0;
        }
        .recap-row .r-label { font-size: 12px; color: var(--text-muted); margin-bottom: 2px; }
        .recap-row .r-value { font-size: 15px; font-weight: 600; color: var(--text); }

        /* === COUNTDOWN === */
        .cd-title { font-size: 12px; color: var(--text-muted); letter-spacing: 1px; margin-bottom: 12px; }
        .countdown { display: flex; justify-content: center; gap: 10px; margin-bottom: 30px; }
        .cd-box {
            background: rgba(0,0,0,0.3);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 12px 6px;
            min-width: 60px;
            text-align: center;
        }
        .cd-num { font-family: 'Inter', sans-serif; font-size: 26px; font-weight: 800; color: var(--gold); line-height: 1; }
        .cd-unit { font-size: 10px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; margin-top: 6px; }

        /* === BUTTONS === */
        .actions { display: flex; flex-direction: column; gap: 12px; align-items: center; }

        .cta-btn {
            display: inline-block;
            font-family: 'Heebo', sans-serif;
            font-size: 16px;
            font-weight: 700;
            padding: 15px 36px;
            border-radius: 14px;
            border: none;
            cursor: pointer;
            background: linear-gradient(135deg, var(--gold-dark), var(--gold), var(--gold-light));
            color: #0a0a0a;
            text-decoration: none;
            transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 24px rgba(212, 175, 55, 0.2);
            width: 100%;
            max-width: 340px;
        }
        .cta-btn:hover { transform: translateY(-3px); box-shadow: 0 8px 40px rgba(212, 175, 55, 0.35); }

        .link-btn {
            font-size: 14px;
            color: var(--text-dim);
            text-decoration: none;
            transition: color 0.3s ease;
        }
        .link-btn:hover { color: var(--gold); }

        /* === FOOTER === */
        .footer {
            position: relative;
            z-index: 1;
            text-align: center;
            padding: 24px;
            border-top: 1px solid var(--glass-border);
        }
        .footer p { font-size: 12px; color: var(--text-muted); }

        @media (max-width: 480px) {
            .thanks-card { padding: 36px 22px; }
            .cd-box { min-width: 52px; }
            .cd-num { font-size: 22px; }
        }
    </style>
</head>
