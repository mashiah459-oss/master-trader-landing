<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>נחזור אליכם לשיחת התאמה · מתן משיח</title>
<meta name="description" content="הפרטים נקלטו. נחזור אליכם לשיחת התאמה קצרה.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#08090c">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700;800;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{--ink:#08090c;--text:#F4F5F7;--dim:#9aa0aa;--mute:#5b616b;
        --accent:#E4322A;--accent-bright:#FF4A3D;--line:#1e2027}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--ink);color:var(--text);font-family:'Heebo',sans-serif;
       line-height:1.75;-webkit-font-smoothing:antialiased;overflow-x:hidden;
       min-height:100vh;display:flex;flex-direction:column}
  .wrap{width:100%;max-width:560px;margin:0 auto;padding:48px 22px;flex:1;
        display:flex;flex-direction:column;justify-content:center}
  .brand{font-family:'Space Mono',monospace;font-weight:700;letter-spacing:.2em;font-size:13px;
         color:#c9ced6;text-align:center;margin-bottom:28px}
  .brand b{color:var(--accent)}
  .card{background:#0e0f14;border:1px solid var(--line);border-radius:16px;
        padding:36px 26px 30px;text-align:center;position:relative;overflow:hidden}
  .card::before{content:"";position:absolute;top:0;right:0;left:0;height:3px;
                background:linear-gradient(90deg,transparent,var(--accent),transparent)}
  .mark{width:56px;height:56px;margin:0 auto 18px;border-radius:50%;
        display:grid;place-items:center;border:1px solid rgba(228,50,42,.45);
        color:var(--accent-bright);font-size:26px;font-weight:800}
  .eyebrow{font-weight:800;font-size:14px;letter-spacing:.08em;color:var(--accent-bright);margin-bottom:10px}
  h1{font-size:clamp(28px,7vw,36px);font-weight:900;line-height:1.15;margin-bottom:14px}
  p{color:var(--dim);font-size:16px;font-weight:300;margin:0 0 14px}
  p b{color:#fff;font-weight:700}
  .back{display:inline-block;margin-top:8px;color:var(--text);font-weight:700;text-decoration:none;
        border-bottom:1px solid rgba(228,50,42,.55);padding-bottom:2px}
  .back:hover{color:var(--accent-bright)}
  footer{text-align:center;padding:0 22px 36px;color:var(--mute);font-size:13px}
</style>
<!-- Meta Pixel (shared) -->
<script src="../../js/pixel.js"></script>
<noscript><img height="1" width="1" style="display:none"
src="https://www.facebook.com/tr?id=3092602027607133&ev=PageView&noscript=1"/></noscript>
<!-- End Meta Pixel -->
</head>
<body>
<main class="wrap">
  <div class="brand">MASTER<b>TRADER</b></div>
  <div class="card">
    <div class="mark" aria-hidden="true">✓</div>
    <p class="eyebrow">הפרטים נקלטו</p>
    <h1>נחזור אליכם.</h1>
    <p>קיבלנו את השם והטלפון. <b>נחזור אליכם לשיחת התאמה קצרה.</b> נכיר, נשמע איפה אתם עומדים, ונבדוק יחד אם זה המקום הנכון בשבילכם עכשיו.</p>
    <p>בינתיים, חמשת הכלים במדריך מחכים. העיקר שמהיום, זה לא בכאילו.</p>
    <a class="back" href="../">חזרה למדריך</a>
  </div>
</main>
<footer>מתן משיח · MasterTrader</footer>
</body>
</html>
